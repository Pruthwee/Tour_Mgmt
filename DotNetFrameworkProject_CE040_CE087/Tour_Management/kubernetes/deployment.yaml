apiVersion: apps/v1
kind: Deployment
metadata:
  name: tour-management
  namespace: tour-management
  labels:
    app: tour-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tour-management
  template:
    metadata:
      labels:
        app: tour-management
    spec:
      containers:
      - name: tour-management
        image: {{IMAGE_URI}}
        ports:
        - containerPort: 80
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: DATABASE_CONNECTION_STRING
          value: "{{DATABASE_CONNECTION_STRING}}"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /HealthCheck.aspx
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /HealthCheck.aspx
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
