apiVersion: apps/v1
kind: Deployment
metadata:
  name: tour-management
  namespace: tour-management
  labels:
    app: tour-management
    version: "1.0"
    environment: production
    framework: dotnet-framework-4.7.2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tour-management
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: tour-management
        version: "1.0"
        environment: production
    spec:
      nodeSelector:
        kubernetes.io/os: windows
      containers:
        - name: tour-management
          image: {{IMAGE_URI}}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: ASPNET_ENV
              value: "Production"
            - name: TOUR_MANAGEMENT_ENV
              value: "Production"
            - name: DB_CONNECTION_STRING
              value: "{{DB_CONNECTION_STRING}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /HealthCheck.ashx
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /HealthCheck.ashx
              port: 80
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
      terminationGracePeriodSeconds: 30
