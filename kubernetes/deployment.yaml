apiVersion: apps/v1
kind: Deployment
metadata:
  name: testing-con-5
  namespace: testing-con-5
  labels:
    app: testing-con-5
spec:
  replicas: 2
  selector:
    matchLabels:
      app: testing-con-5
  template:
    metadata:
      labels:
        app: testing-con-5
    spec:
      # Windows containers run only on Windows nodes (the node pool must match the image's Windows Server version)
      nodeSelector:
        kubernetes.io/os: windows
      # ServiceAccount annotated with the IAM role (IRSA) that may write to the S3 bucket
      serviceAccountName: testing-con-5-sa
      containers:
        - name: testing-con-5
          image: "{{IMAGE_URI}}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: S3_BUCKET_NAME
              value: "{{S3_BUCKET_NAME}}"
            - name: AWS_REGION
              value: "{{AWS_REGION}}"
            - name: TOUR_PICS_BASE_URL
              value: "{{TOUR_PICS_BASE_URL}}"
            - name: ConnectionStrings__dbconnection
              valueFrom:
                secretKeyRef:
                  name: testing-con-5-secrets
                  key: ConnectionStrings__dbconnection
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
